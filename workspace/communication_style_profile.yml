preferred_directness: answer their last beat first, then one short context beat, then one easy ask
preferred_casualness: sounds like a person on LinkedIn, not a networking email. Short paragraphs. No polish for polish's sake.
banned_phrases:
- would be great to connect
- pick your brain
- quick coffee chat
- your work stood out
- learn from your experience
- product/company direction
- AI product direction
- I can build, not just spec
- I've been deep in product for a while now, coming from engineering
- I've been deep in product for a while now, coming from a
- so I can build, not just spec
self_intro_variants:
- I'm at USC Marshall for my MBA, with about five years building data and platform systems before that.
- 5 years building data/platform systems, then an MBA, now doing product.
- I'm a Marshall MBA with an engineering background, now doing applied AI and data platform product work.
approved_asks_by_recipient_type:
  founder:
  - Ask whether a technical MBA/product background fits anything useful there.
  - Ask who owns product, ops, or internship hiring if there is a credible fit.
  senior_product:
  - Ask a specific team-direction or product-scope question tied to Akshat's background.
  - Ask how technical PM candidates can be useful to the team.
  junior_product_apm:
  - Ask how to get on the hiring team's radar.
  - Ask what signal matters most for APM or early-PM candidates.
  engineer_india:
  - Ask for a referral or hiring-team pointer when the company and role fit are reasonable.
  - Ask whether they can point you to the right referral or hiring path if there is a relevant opening.
  engineer:
  - Ask how builders influence product decisions there.
  - Ask how technical PM or product candidates stand out.
  recruiter:
  - Ask for process or screening guidance for the relevant role path.
  - Ask whether there is a better hiring-team contact for PM, product ops, or strategy roles.
  general:
  - Ask for one concrete pointer, routing suggestion, or next person to speak with.
strong_messages:
- label: operator_gold_jeffrey_entrust_20260730
  recipient_type: general
  message: "Thanks Jeffrey! Two things that would help most.\n\nOne, does Entrust take product interns right now, particularly anywhere near the developer security or identity side? Two, if so, who owns that hiring? Happy to go through the normal process, just want to land in front of the right person.\n\nContext: 5 years building data/platform systems, then an MBA, now doing product. The developer security work is what pulled me toward Entrust specifically."
  notes: Operator-approved style gold. Opens on their offer, short beats, no dashes, specific ask, context last.
  source: operator_approved_20260730
- label: operator_gold_gautam_etched_20260730
  recipient_type: engineer
  message: "Thanks Gautam, appreciate you offering. I went through the openings. They're almost all silicon and hardware right now, and the TPM roles want tape out experience I don't have, so I don't want to waste your time forcing a fit.\n\nShort context: I'm at USC Marshall for my MBA, 5 years backend/data platform engineering before that, now doing applied AI product work. Mainly looking for product internships right now, and I had also looked at the GTM Intern path. Sending that resume for context. If anything opens on product or GTM/bizops intern, I'd really appreciate you flagging it."
  notes: Operator-approved style gold. Reacts to their ask, honest about fit, specific next step.
  source: operator_approved_20260730
