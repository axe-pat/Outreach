notes: |
  Open by answering their last message. Use short paragraph beats. Never use em dashes or mid-clause " - " joins; prefer periods. Be specific to this thread. Avoid stock lines like "I can build, not just spec." End with one easy question.

  Preferred invite close: "Would love to connect." (statement, not a question). Do not use "Would love to connect?" or "Would be great to connect."

  This profile is intentionally local and reviewable. Generators should use it for asks, banned phrases, and examples before expanding automated follow-ups.
